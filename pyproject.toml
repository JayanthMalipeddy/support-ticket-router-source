[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "support-ticket-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
inference = ["torch>=2.6", "transformers>=4.51,<5", "accelerate>=1", "peft>=0.15"]
[tool.setuptools.packages.find]
include = ["ticket_router*"]
